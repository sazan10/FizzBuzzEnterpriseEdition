name: Run Jtrace

on:
  push:

jobs:
  run-jpf:
    name: '${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        ref: 4922c077c07a3744ae67ee8a932786f15bf57411
  
    - name: Set up JDK 11 for JPF
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'
    - name: Set up Java 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'
        cache: 'maven'
    - name: run tracemop
      uses: SoftEngResearch/tracemop@master
    - name: Upload Traces
      uses: actions/upload-artifact@v4
      with:
        name: traces
        path: './FizzBuzzEnterpriseEdition/FizzBuzzEnterpriseEdition/traces/*'
    - name: LIst files
      run: | 
        pwd
        ls -l 

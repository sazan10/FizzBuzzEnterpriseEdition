name: Run Jtrace

on:
  push:

jobs:
  run-jtrace:
    name: '${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        ref: 5cbc47fbd6e18d2ae01ddc6a16c1dfa668c1c7b7
  
    - name: Set up Java 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'
        cache: 'maven'
    - name: run tracemop
      uses: SoftEngResearch/tracemop@master
    # - name: Upload Traces
      # uses: actions/upload-artifact@v4
      # with:
      #   name: traces
      #   path: './*'
    - name: LIst files
      run: | 
        pwd
        ls -l 
